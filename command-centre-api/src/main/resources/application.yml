spring:
  application:
    name: command-centre-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/command_centre}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

server:
  port: 8080

app:
  owner:
    email: ${OWNER_EMAIL:karthikvikash02@gmail.com}
    name: ${OWNER_NAME:Karthik}
    password: ${OWNER_PASSWORD:CommandCentre@2024}
  resend:
    api-key: ${RESEND_API_KEY:re_WD3tbQrR_Ly8unwBZi8q4Ppq2xXVizEkU}
    from-email: '${RESEND_FROM_EMAIL:Command Centre <onboarding@resend.dev>}'
  session:
    timeout-hours: ${SESSION_TIMEOUT_HOURS:24}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:2}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  rate-limit:
    login-attempts-per-minute: ${RATE_LIMIT_LOGIN:5}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3}
